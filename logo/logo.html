<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000}svg{display:block}</style>
</head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#ffe14d"/>
      <stop offset="0.5" stop-color="#ffb400"/>
      <stop offset="1" stop-color="#ff5a00"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset="0.5" stop-color="#ffcc00"/>
      <stop offset="1" stop-color="#d98a00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="flagclip"><rect x="0" y="0" width="52" height="34" rx="4"/></clipPath>
  </defs>

  <!-- Fondo con rayos -->
  <rect width="800" height="800" fill="url(#bg)"/>
  <g id="rays" transform="translate(400 330)"></g>

  <!-- Busto: traje -->
  <g stroke-linejoin="round" stroke-linecap="round" filter="url(#shadow)">
    <path d="M110,820 Q115,600 250,545 L550,545 Q685,600 690,820 Z" fill="#1f1f1f" stroke="#000" stroke-width="12"/>
    <path d="M325,535 L400,700 L475,535 Z" fill="#fff" stroke="#000" stroke-width="8"/>
    <path d="M380,548 L420,548 L413,580 L387,580 Z" fill="#000"/>
    <path d="M387,580 L413,580 L430,780 L400,815 L370,780 Z" fill="#000"/>
    <path d="M325,535 L280,600 L318,618 L290,645 L400,760" fill="none" stroke="#4a4a4a" stroke-width="8"/>
    <path d="M475,535 L520,600 L482,618 L510,645 L400,760" fill="none" stroke="#4a4a4a" stroke-width="8"/>
    <!-- Pin bandera -->
    <g transform="translate(505 655) rotate(-4)">
      <g clip-path="url(#flagclip)">
        <rect width="52" height="34" fill="#fff"/>
        <rect y="0" width="52" height="5.2" fill="#d22"/>
        <rect y="10.4" width="52" height="5.2" fill="#d22"/>
        <rect y="20.8" width="52" height="5.2" fill="#d22"/>
        <rect y="31.2" width="52" height="5.2" fill="#d22"/>
        <rect width="22" height="18" fill="#1f3c9c"/>
      </g>
      <rect width="52" height="34" rx="4" fill="none" stroke="#000" stroke-width="3"/>
    </g>
  </g>

  <!-- Cabeza con gafas (mismo diseño del personaje, escalado) -->
  <g transform="translate(129.2 125.8) scale(2.22)" stroke-linejoin="round" stroke-linecap="round" filter="url(#shadow)">
    <circle cx="122" cy="92" r="90" fill="#fff" stroke="#000" stroke-width="5.5"/>
    <path d="M34,88 L210,88" stroke="#000" stroke-width="6.5"/>
    <path d="M44,86 L114,86 Q116,118 98,128 Q70,136 54,120 Q42,106 44,86 Z" fill="#0d0d0d" stroke="#000" stroke-width="3.5"/>
    <path d="M130,86 L200,86 Q202,106 190,120 Q174,136 146,128 Q128,118 130,86 Z" fill="#0d0d0d" stroke="#000" stroke-width="3.5"/>
    <path d="M58,96 L80,96" stroke="#fff" stroke-width="4.5" opacity="0.6"/>
    <path d="M144,96 L166,96" stroke="#fff" stroke-width="4.5" opacity="0.6"/>
    <path d="M110,152 L136,150" stroke="#000" stroke-width="4.5"/>
  </g>

  <!-- Insignia #1 y signo de interrogación -->
  <g filter="url(#shadow)">
    <circle cx="165" cy="235" r="62" fill="url(#gold)" stroke="#000" stroke-width="9"/>
    <text x="165" y="258" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="64" fill="#000">#1</text>
    <text x="640" y="250" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="150" fill="#ff2d55" stroke="#000" stroke-width="10" paint-order="stroke" transform="rotate(14 640 200)">?</text>
  </g>

  <script>
    const g = document.getElementById('rays');
    const n = 20, R = 1200;
    for (let i = 0; i < n; i++) {
      const a1 = (i / n) * Math.PI * 2, a2 = a1 + Math.PI / n;
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', `M0,0 L${R*Math.cos(a1)},${R*Math.sin(a1)} L${R*Math.cos(a2)},${R*Math.sin(a2)} Z`);
      p.setAttribute('fill', '#fff');
      p.setAttribute('opacity', '0.16');
      g.appendChild(p);
    }
  </script>
</svg>
</body></html>
