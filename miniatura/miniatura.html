<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000}svg{display:block}</style>
</head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="bg" cx="70%" cy="45%" r="80%">
      <stop offset="0" stop-color="#ffe14d"/>
      <stop offset="0.45" stop-color="#ffb400"/>
      <stop offset="1" stop-color="#ff5a00"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset="0.5" stop-color="#ffcc00"/>
      <stop offset="1" stop-color="#d98a00"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b3b"/>
      <stop offset="1" stop-color="#c40000"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="10" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="flagclip"><rect x="0" y="0" width="26" height="17" rx="2"/></clipPath>
  </defs>

  <!-- Fondo con rayos -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g id="rays" transform="translate(900 330)"></g>

  <!-- Pedestal del puesto #1 -->
  <g filter="url(#shadow)">
    <rect x="740" y="626" width="330" height="120" rx="10" fill="url(#gold)" stroke="#000" stroke-width="7"/>
    <text x="905" y="696" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="72" fill="#000">#1</text>
  </g>

  <!-- Stickman trajeado (escala del dibujo original 243x542) -->
  <g transform="translate(752 -6) scale(1.22)" stroke-linejoin="round" stroke-linecap="round" filter="url(#shadow)">
    <!-- Pantalones -->
    <path d="M72,330 L68,500 L114,500 L122,385 L130,500 L176,500 L172,330 Z" fill="#1d1d1d" stroke="#000" stroke-width="6"/>
    <line x1="122" y1="385" x2="122" y2="345" stroke="#000" stroke-width="4"/>
    <!-- Zapatos -->
    <path d="M58,500 L116,500 Q120,522 100,524 L60,524 Q46,520 58,500 Z" fill="#111" stroke="#000" stroke-width="6"/>
    <path d="M128,500 L186,500 Q198,520 184,524 L144,524 Q124,522 128,500 Z" fill="#111" stroke="#000" stroke-width="6"/>
    <!-- Mangas (brazos atrás) -->
    <path d="M60,200 Q30,250 40,330 Q48,350 70,340 Q66,280 80,215 Z" fill="#262626" stroke="#000" stroke-width="6"/>
    <path d="M184,200 Q214,250 204,330 Q196,350 174,340 Q178,280 164,215 Z" fill="#262626" stroke="#000" stroke-width="6"/>
    <!-- Chaqueta -->
    <path d="M78,178 Q52,186 50,230 L54,372 Q122,388 190,372 L194,230 Q192,186 166,178 Z" fill="#1f1f1f" stroke="#000" stroke-width="6"/>
    <!-- Camisa -->
    <path d="M98,176 L122,262 L146,176 Z" fill="#fff" stroke="#000" stroke-width="4"/>
    <!-- Corbata -->
    <path d="M114,182 L130,182 L127,196 L117,196 Z" fill="#000"/>
    <path d="M117,196 L127,196 L134,290 L122,306 L110,290 Z" fill="#000"/>
    <!-- Solapas -->
    <path d="M98,176 L80,206 L96,214 L84,226 L122,280" fill="none" stroke="#4a4a4a" stroke-width="4"/>
    <path d="M146,176 L164,206 L148,214 L160,226 L122,280" fill="none" stroke="#4a4a4a" stroke-width="4"/>
    <line x1="122" y1="280" x2="122" y2="372" stroke="#4a4a4a" stroke-width="3"/>
    <circle cx="128" cy="300" r="3.5" fill="#555"/>
    <circle cx="128" cy="330" r="3.5" fill="#555"/>
    <!-- Pin bandera EEUU -->
    <g transform="translate(150 230) rotate(-4)">
      <g clip-path="url(#flagclip)">
        <rect width="26" height="17" fill="#fff"/>
        <rect y="0" width="26" height="2.6" fill="#d22"/>
        <rect y="5.2" width="26" height="2.6" fill="#d22"/>
        <rect y="10.4" width="26" height="2.6" fill="#d22"/>
        <rect y="15.6" width="26" height="2.6" fill="#d22"/>
        <rect width="11" height="9" fill="#1f3c9c"/>
      </g>
      <rect width="26" height="17" rx="2" fill="none" stroke="#000" stroke-width="1.5"/>
    </g>
    <!-- Cabeza -->
    <circle cx="122" cy="92" r="90" fill="#fff" stroke="#000" stroke-width="6"/>
    <!-- Gafas de sol -->
    <path d="M34,88 L210,88" stroke="#000" stroke-width="7"/>
    <path d="M44,86 L114,86 Q116,118 98,128 Q70,136 54,120 Q42,106 44,86 Z" fill="#0d0d0d" stroke="#000" stroke-width="4"/>
    <path d="M130,86 L200,86 Q202,106 190,120 Q174,136 146,128 Q128,118 130,86 Z" fill="#0d0d0d" stroke="#000" stroke-width="4"/>
    <path d="M58,96 L80,96" stroke="#fff" stroke-width="5" opacity="0.6"/>
    <path d="M144,96 L166,96" stroke="#fff" stroke-width="5" opacity="0.6"/>
    <!-- Boca -->
    <path d="M110,152 L136,150" stroke="#000" stroke-width="5"/>
  </g>

  <!-- Signos de interrogación -->
  <g font-family="Inter Display" font-weight="900" stroke="#000" stroke-width="7" paint-order="stroke" filter="url(#shadow)">
    <text x="1120" y="190" font-size="150" fill="#ff2d55" transform="rotate(14 1150 140)">?</text>
    <text x="1170" y="420" font-size="110" fill="#00c2ff" transform="rotate(-10 1190 380)">!</text>
    <text x="690" y="170" font-size="100" fill="#7cff4f" transform="rotate(-16 710 130)">?</text>
  </g>

  <!-- Textos -->
  <g font-family="Inter Display" font-weight="900" paint-order="stroke" stroke-linejoin="round" filter="url(#shadow)">
    <g transform="translate(40 0) skewX(-8)">
      <text x="40" y="270" font-size="250" fill="#fff" stroke="#000" stroke-width="22" letter-spacing="-8">TOP</text>
      <text x="40" y="500" font-size="270" fill="url(#gold)" stroke="#000" stroke-width="22" letter-spacing="-10">10</text>
    </g>
  </g>
  <!-- Cinta roja -->
  <g filter="url(#shadow)" transform="rotate(-4 330 600)">
    <rect x="40" y="545" width="640" height="105" rx="12" fill="url(#red)" stroke="#000" stroke-width="7"/>
    <text x="360" y="621" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="64" fill="#fff" stroke="#000" stroke-width="8" paint-order="stroke" letter-spacing="1">CURIOSIDADES</text>
  </g>

  <script>
    // Genera rayos de fondo
    const g = document.getElementById('rays');
    const n = 24, R = 1600;
    for (let i = 0; i < n; i++) {
      const a1 = (i / n) * Math.PI * 2, a2 = a1 + Math.PI / n;
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', `M0,0 L${R*Math.cos(a1)},${R*Math.sin(a1)} L${R*Math.cos(a2)},${R*Math.sin(a2)} Z`);
      p.setAttribute('fill', '#fff');
      p.setAttribute('opacity', '0.16');
      g.appendChild(p);
    }
  </script>
</svg>
</body></html>
